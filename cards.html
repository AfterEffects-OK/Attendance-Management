<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社員証QRコード一覧・印刷</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      padding: 20px;
    }
    .toolbar {
      max-width: 1080px;
      margin: 0 auto 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }
    .toolbar-left {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .toolbar-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .filter-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }
    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    #status-msg {
      max-width: 1080px;
      margin: 0 auto 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #cards-grid {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .id-card {
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-dept {
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      background: #f1f5f9;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .card-kana {
      font-size: 0.72rem;
      color: #64748b;
      line-height: 1.2;
    }
    .card-name {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .card-id {
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #334155;
    }
    .card-qr {
      width: 96px;
      height: 96px;
      padding: 4px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-qr img,
    .card-qr canvas {
      width: 88px !important;
      height: 88px !important;
    }

    @media print {
      body {
        background: #ffffff;
        color: #000000;
        padding: 0;
      }
      .toolbar,
      #status-msg {
        display: none !important;
      }
      #cards-grid {
        max-width: 100%;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .id-card {
        border: 1px solid #000000;
        border-radius: 6px;
        padding: 12px;
      }
      .card-dept {
        border: 1px solid #cbd5e1;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="toolbar-title">社員証QRコード一覧</div>
      <label class="filter-label">
        <input type="checkbox" id="only-active" checked onchange="loadCards()">
        在籍中のみ表示
      </label>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="./index.html" class="btn btn-secondary">打刻画面へ</a>
      <button class="btn" onclick="window.print()">印刷する</button>
      <button class="btn btn-secondary" onclick="reloadList()">再読み込み</button>
    </div>
  </div>

  <div id="status-msg">従業員データを読み込んでいます...</div>
  <div id="cards-grid"></div>

  <script>
    // GASウェブアプリのデプロイURLを設定してください
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/あなたのデプロイID/exec';

    function reloadList() {
      document.getElementById('status-msg').textContent = '従業員データを再読み込みしています...';
      loadCards();
    }

    async function loadCards() {
      const onlyActive = document.getElementById('only-active').checked;
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      try {
        const response = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'getEmployeesForQrCards',
            onlyActive: onlyActive
          })
        });
        if (!response.ok) {
          throw new Error('HTTPエラー: ' + response.status);
        }
        const data = await response.json();
        const employees = (data && data.employees) ? data.employees : [];

        const statusEl = document.getElementById('status-msg');
        if (!employees.length) {
          statusEl.textContent = '表示対象の従業員データがありません。';
          return;
        }

        statusEl.textContent = `${employees.length} 名分の社員証QRコードを表示中（QR内データ：従業員IDのみ）`;

        employees.forEach(emp => {
          const card = document.createElement('div');
          card.className = 'id-card';

          const infoDiv = document.createElement('div');
          infoDiv.className = 'card-info';
          infoDiv.innerHTML = `
            <div class="card-dept">${escapeHtml(emp.dept)}</div>
            ${emp.kana ? `<div class="card-kana">${escapeHtml(emp.kana)}</div>` : ''}
            <div class="card-name">${escapeHtml(emp.name)}</div>
            <div class="card-id">ID: ${escapeHtml(emp.id)}</div>
          `;

          const qrBox = document.createElement('div');
          qrBox.className = 'card-qr';

          card.appendChild(infoDiv);
          card.appendChild(qrBox);
          grid.appendChild(card);

          new QRCode(qrBox, {
            text: emp.id,
            width: 88,
            height: 88,
            correctLevel: QRCode.CorrectLevel.M
          });
        });
      } catch (err) {
        document.getElementById('status-msg').textContent = '読み込みエラー: ' + err.message;
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.addEventListener('load', loadCards);
  </script>
</body>
</html>
