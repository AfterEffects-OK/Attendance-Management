<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>QR勤怠打刻</title>
  <script id="qr-lib-primary" src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="tryNextQrCdn()"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
      gap: 8px;
      flex-wrap: wrap;
    }
    .clock {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-sm {
      background: var(--surface);
      color: var(--text);
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-sm.active-cam {
      border-color: var(--accent);
      color: var(--accent);
    }
    @media (max-width: 640px) {
      .btn-qr-cards {
        display: none;
      }
    }
    .mode-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .mode-btn {
      background: var(--surface);
      color: var(--muted);
      border: 2px solid transparent;
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-btn.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
    }
    #reader-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    #reader {
      width: 100%;
    }
    .scan-guide {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .recent-logs {
      width: 100%;
      max-width: 480px;
      margin: 14px auto 0;
      background: var(--surface);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .recent-logs-title {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .recent-log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }
    .recent-log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.55);
    }
    .recent-log-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .recent-log-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .log-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
    }
    .log-status.is-pending {
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
    }
    .log-status.is-success {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    .log-status.is-warning {
      background: rgba(245, 158, 11, 0.22);
      color: #fcd34d;
    }
    .log-status.is-error {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
    }
    .recent-log-empty {
      color: var(--muted);
      font-size: 0.82rem;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 100;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }
    #overlay.show { display: flex; }
    #overlay.success { background: rgba(20, 83, 45, 0.94); }
    #overlay.warning { background: rgba(120, 53, 15, 0.94); }
    #overlay.error   { background: rgba(127, 29, 29, 0.94); }
    #overlay.loading { background: rgba(15, 23, 42, 0.88); }

    .badge {
      font-size: 1.4rem;
      font-weight: 800;
      padding: 6px 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      margin-bottom: 16px;
    }
    .emp-name {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .detail-msg {
      font-size: 1.05rem;
      line-height: 1.6;
      opacity: 0.95;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div id="date-display" style="font-size: 0.8rem; color: var(--muted);">----/--/--</div>
      <div id="clock-display" class="clock">00:00:00</div>
    </div>
    <div class="header-actions">
      <button id="toggle-cam-btn" class="btn-sm active-cam" onclick="toggleCamera()">カメラ停止</button>
      <button id="switch-cam-btn" class="btn-sm" onclick="switchCamera()">カメラ切替</button>
      <a href="./status.html" class="btn-sm">勤怠確認</a>
      <a href="./card.html" class="btn-sm btn-qr-cards">社員証QR印刷</a>
    </div>
  </header>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="AUTO" onclick="setMode(this)">自動 (出勤/退勤)</button>
    <button class="mode-btn" data-mode="BREAK_START" onclick="setMode(this)">休憩開始</button>
    <button class="mode-btn" data-mode="BREAK_END" onclick="setMode(this)">休憩終了</button>
  </div>

  <div id="reader-wrapper">
    <div id="reader"></div>
  </div>
  <p id="scan-guide" class="scan-guide">QRコード（従業員ID）をカメラ枠内にかざしてください（連続打刻対応）</p>

  <section class="recent-logs" aria-label="直近の打刻履歴">
    <div class="recent-logs-title">直近の打刻（最新5件）</div>
    <ul id="recent-log-list" class="recent-log-list">
      <li class="recent-log-empty">まだ打刻はありません</li>
    </ul>
  </section>

  <div id="overlay" onclick="dismissOverlay()">
    <div id="overlay-badge" class="badge">処理中</div>
    <div id="overlay-name" class="emp-name"></div>
    <div id="overlay-msg" class="detail-msg"></div>
  </div>

  <script>
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxXYd9al_H105tYO7RMG78hMoN27SQbEOaGy6vdst5IAUS0dhsHlx-3YdVPlMUIwGFy/exec';

    const QR_CDN_LIST = [
      'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'
    ];
    let qrCdnIndex = 0;

    // 読取後処理の体感短縮設定（約0.85秒で次へ進める目安）
    const FAST_COMPLETE_MS = 850;
    const SUCCESS_OVERLAY_MS = 700;
    const WARNING_OVERLAY_MS = 1200;
    const ERROR_OVERLAY_MS = 1800;
    const SAME_ID_COOLDOWN_MS = 2500;
    const API_TIMEOUT_MS = 6000;
    const MAX_RECENT_LOGS = 5;

    let currentMode = 'AUTO';
    let isProcessing = false;
    let isSwitchingCamera = false;
    let isCameraActive = false;
    let html5QrCode = null;
    let facingMode = 'environment';
    let currentCameraId = null;
    let overlayTimer = null;
    let lastScannedId = null;
    let lastScannedAt = 0;
    let logSeq = 0;
    const recentLogs = [];

    function getDeviceLabel() {
      const ua = navigator.userAgent;
      if (/iPhone/i.test(ua)) return 'iPhone';
      if (/iPad/i.test(ua)) return 'iPad';
      if (/Android/i.test(ua)) return 'Android';
      return 'PCブラウザ';
    }
    const DEVICE_LABEL = getDeviceLabel();

    function tryNextQrCdn() {
      if (typeof Html5Qrcode !== 'undefined') return;
      if (qrCdnIndex >= QR_CDN_LIST.length) return;
      const nextUrl = QR_CDN_LIST[qrCdnIndex++];
      const s = document.createElement('script');
      s.src = nextUrl;
      s.onerror = () => tryNextQrCdn();
      document.head.appendChild(s);
    }

    async function waitForHtml5Qrcode(timeoutMs = 5000) {
      if (typeof Html5Qrcode !== 'undefined') return true;
      if (qrCdnIndex === 0) {
        tryNextQrCdn();
      }
      const start = Date.now();
      while (typeof Html5Qrcode === 'undefined') {
        if (Date.now() - start >= timeoutMs) {
          return false;
        }
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      return true;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('date-display').textContent =
        now.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
      document.getElementById('clock-display').textContent =
        now.toLocaleTimeString('ja-JP', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateCameraButtonUI() {
      const btn = document.getElementById('toggle-cam-btn');
      const guide = document.getElementById('scan-guide');
      if (isCameraActive) {
        btn.textContent = 'カメラ停止';
        btn.classList.add('active-cam');
        guide.textContent = 'QRコード（従業員ID）をカメラ枠内にかざしてください（連続打刻対応）';
      } else {
        btn.textContent = 'カメラ起動';
        btn.classList.remove('active-cam');
        guide.textContent = 'カメラが停止中です。「カメラ起動」を押して開始してください';
      }
    }

    function setMode(btn) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
    }

    function playTone(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.16);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        }
      } catch (e) {}
    }

    function renderRecentLogs() {
      const listEl = document.getElementById('recent-log-list');
      if (!listEl) return;
      if (recentLogs.length === 0) {
        listEl.innerHTML = '<li class="recent-log-empty">まだ打刻はありません</li>';
        return;
      }
      listEl.innerHTML = recentLogs.map(item => {
        const statusClass = item.statusType === 'pending' ? 'is-pending'
          : item.statusType === 'success' ? 'is-success'
          : item.statusType === 'warning' ? 'is-warning'
          : item.statusType === 'error' ? 'is-error' : '';
        const statusBadge = item.statusText
          ? `<span class="log-status ${statusClass}">${escapeHtml(item.statusText)}</span>`
          : '';
        return `
          <li class="recent-log-item">
            <span class="recent-log-main">
              <strong>${escapeHtml(item.name)}</strong>（${escapeHtml(item.stampType)}）
            </span>
            <span class="recent-log-meta">
              ${statusBadge}
              <span>${escapeHtml(item.time)}</span>
            </span>
          </li>
        `;
      }).join('');
    }

    function addPendingRecentLog(name, stampType, time) {
      const id = ++logSeq;
      recentLogs.unshift({
        id,
        name,
        stampType,
        time,
        statusText: '送信中',
        statusType: 'pending'
      });
      if (recentLogs.length > MAX_RECENT_LOGS) {
        recentLogs.pop();
      }
      renderRecentLogs();
      return id;
    }

    function updateRecentLogStatus(id, patch) {
      const target = recentLogs.find(item => item.id === id);
      if (!target) return;
      Object.assign(target, patch);
      renderRecentLogs();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function dismissOverlay() {
      if (overlayTimer) {
        clearTimeout(overlayTimer);
        overlayTimer = null;
      }
      const overlay = document.getElementById('overlay');
      overlay.className = '';
      if (currentMode !== 'AUTO') {
        const autoBtn = document.querySelector('.mode-btn[data-mode="AUTO"]');
        if (autoBtn) {
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          autoBtn.classList.add('active');
        }
        currentMode = 'AUTO';
      }
      isProcessing = false;
    }

    function showOverlay(statusClass, badgeText, nameText, msgText, autoHideMs = 0) {
      if (overlayTimer) {
        clearTimeout(overlayTimer);
        overlayTimer = null;
      }
      const overlay = document.getElementById('overlay');
      overlay.className = 'show ' + statusClass;
      document.getElementById('overlay-badge').textContent = badgeText;
      document.getElementById('overlay-name').textContent = nameText;
      document.getElementById('overlay-msg').innerHTML = msgText;

      if (autoHideMs > 0) {
        overlayTimer = setTimeout(() => {
          dismissOverlay();
        }, autoHideMs);
      }
    }

    function formatCameraError(err) {
      if (!err) return '不明なエラー';
      const name = err.name ? `[${err.name}] ` : '';
      const msg = err.message ? err.message : String(err);
      return name + msg;
    }

    function formatNowTimeJst() {
      return new Date().toLocaleTimeString('ja-JP', { hour12: false });
    }

    function guessStampTypeFast(empId, mode) {
      if (mode === 'BREAK_START') return '休憩開始';
      if (mode === 'BREAK_END') return '休憩終了';
      const todayKey = `ATT_STATE_${empId}_${new Date().toISOString().slice(0, 10)}`;
      const prev = sessionStorage.getItem(todayKey);
      const next = (prev === '出勤') ? '退勤' : '出勤';
      sessionStorage.setItem(todayKey, next);
      return next;
    }

    async function callGasApi(payload) {
      const controller = new AbortController();
      const timerId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
      try {
        const response = await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        if (!response.ok) {
          throw new Error('HTTPエラー: ' + response.status);
        }
        return await response.json();
      } finally {
        clearTimeout(timerId);
      }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing || isSwitchingCamera) return;

      const normalizedId = String(decodedText || '').trim();
      if (!normalizedId) return;

      const nowMs = Date.now();
      if (normalizedId === lastScannedId && (nowMs - lastScannedAt) < SAME_ID_COOLDOWN_MS) {
        return;
      }

      isProcessing = true;
      lastScannedId = normalizedId;
      lastScannedAt = nowMs;

      const stampTime = formatNowTimeJst();
      const optimisticType = guessStampTypeFast(normalizedId, currentMode);
      const requestMode = currentMode;

      // 1. 読み取り後すぐに「直近の打刻」へ仮表示を追加
      const pendingLogId = addPendingRecentLog(normalizedId, optimisticType, stampTime);

      // 2. 完了演出は約0.85秒で自動的に次へ進め、連続打刻を素早く受け付ける
      playTone('success');
      showOverlay(
        'success',
        optimisticType + ' 受付',
        normalizedId,
        `${stampTime} 記録処理中...`,
        FAST_COMPLETE_MS
      );

      // 3. 処理完了後にステータス・確定情報を反映
      callGasApi({
        action: 'recordAttendance',
        empId: normalizedId,
        mode: requestMode,
        deviceName: DEVICE_LABEL
      }).then((res) => {
        if (res && res.success) {
          const confirmedName = res.employeeName || normalizedId;
          const confirmedType = res.stampType || optimisticType;
          const confirmedTime = res.time || stampTime;
          const breakSuffix = (confirmedType === '休憩終了' && res.breakMinutes !== null && res.breakMinutes !== undefined)
            ? ` / 休憩${res.breakMinutes}分`
            : '';

          updateRecentLogStatus(pendingLogId, {
            name: confirmedName,
            stampType: confirmedType,
            time: confirmedTime,
            statusText: `記録済${breakSuffix}`,
            statusType: 'success'
          });

          if (confirmedType === '休憩終了' && res.breakMinutes !== null && res.breakMinutes !== undefined) {
            showOverlay(
              'success',
              confirmedType + ' 完了',
              confirmedName + ' さん',
              `${confirmedTime} に記録しました<br>本日の合計休憩時間：<strong>${res.breakMinutes}分</strong>`,
              SUCCESS_OVERLAY_MS
            );
          }
        } else if (res && res.isDuplicate) {
          updateRecentLogStatus(pendingLogId, {
            statusText: '重複',
            statusType: 'warning'
          });
          playTone('error');
          showOverlay('warning', '連続打刻防止', '', res.message, WARNING_OVERLAY_MS);
        } else {
          updateRecentLogStatus(pendingLogId, {
            statusText: 'エラー',
            statusType: 'error'
          });
          playTone('error');
          showOverlay('error', '記録エラー', '', (res && res.message) || '記録に失敗しました', ERROR_OVERLAY_MS);
        }
      }).catch((err) => {
        updateRecentLogStatus(pendingLogId, {
          statusText: '通信エラー',
          statusType: 'error'
        });
        playTone('error');
        const msg = err && err.name === 'AbortError'
          ? '通信がタイムアウトしました。電波状況をご確認ください。'
          : formatCameraError(err);
        showOverlay('error', '通信エラー', '', msg, ERROR_OVERLAY_MS);
      });
    }

    async function startScanner() {
      try {
        const ready = await waitForHtml5Qrcode(5000);
        if (!ready || typeof Html5Qrcode === 'undefined') {
          isCameraActive = false;
          updateCameraButtonUI();
          showOverlay('error', 'カメラ起動エラー', '', 'QRライブラリ（Html5Qrcode）の読み込みに失敗しました。通信環境や広告ブロックをご確認ください。', 4500);
          return;
        }

        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode('reader');
        }

        const config = {
          fps: 15,
          qrbox: { width: 260, height: 260 },
          aspectRatio: 1.0
        };

        try {
          await html5QrCode.start({ facingMode: facingMode }, config, onScanSuccess);
          currentCameraId = null;
          isCameraActive = true;
          updateCameraButtonUI();
          return;
        } catch (facingErr) {
          const cameras = await Html5Qrcode.getCameras();
          if (!cameras || cameras.length === 0) {
            throw facingErr;
          }

          const orderedCameras = [
            ...cameras.filter(c => c.id !== currentCameraId),
            ...cameras.filter(c => c.id === currentCameraId)
          ];

          let lastErr = facingErr;
          for (const cam of orderedCameras) {
            try {
              await html5QrCode.start(cam.id, config, onScanSuccess);
              currentCameraId = cam.id;
              isCameraActive = true;
              updateCameraButtonUI();
              return;
            } catch (camErr) {
              lastErr = camErr;
            }
          }
          throw lastErr;
        }
      } catch (err) {
        isCameraActive = false;
        updateCameraButtonUI();
        showOverlay('error', 'カメラ起動エラー', '', formatCameraError(err), 4500);
      }
    }

    async function toggleCamera() {
      if (isProcessing || isSwitchingCamera) return;
      isSwitchingCamera = true;
      if (isCameraActive) {
        try {
          if (html5QrCode && html5QrCode.isScanning) {
            await html5QrCode.stop();
          }
        } catch (e) {}
        try {
          if (html5QrCode) {
            await html5QrCode.clear();
          }
        } catch (e) {}
        isCameraActive = false;
        updateCameraButtonUI();
      } else {
        await startScanner();
      }
      isSwitchingCamera = false;
    }

    async function switchCamera() {
      if (!html5QrCode || isProcessing || isSwitchingCamera) return;
      isSwitchingCamera = true;

      try {
        if (html5QrCode.isScanning) {
          await html5QrCode.stop();
        }
      } catch (e) {}

      try {
        await html5QrCode.clear();
      } catch (e) {}

      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      await new Promise(resolve => setTimeout(resolve, 200));
      await startScanner();
      isSwitchingCamera = false;
    }

    window.addEventListener('load', startScanner);
  </script>
</body>
</html>
